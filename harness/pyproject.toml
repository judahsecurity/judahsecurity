[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-harness"
version = "0.1.0"
description = "Batch scanning and detection-accuracy benchmarking for the Aegis Vanguard autonomous pentester."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# LLM-backed judge (optional — the default heuristic judge needs nothing).
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["local_harness*"]

[tool.setuptools.package-data]
local_harness = ["benchmark/ground_truth/*.json", "batch/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
