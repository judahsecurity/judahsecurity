name: aegis-vanguard tests

# Test-gate for the Vanguard agent. Runs the full unittest suite on every push
# to main and on PRs that touch the harness, so a broken change can't reach the
# aegis-vanguard:latest image that production's scanner worker runs.

on:
  push:
    branches: [main]
    paths:
      - "aegis-vanguard/**"
  pull_request:
    paths:
      - "aegis-vanguard/**"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-vanguard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unittest suite
        run: python -m unittest discover -s tests -v
