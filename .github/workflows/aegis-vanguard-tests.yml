name: aegis-vanguard tests

# Test-gate for the Vanguard Claude Code skills and prowl_client.py. Also checks
# that the offline proof-class copy (data/vuln_classes.json) matches Prowl's
# proof_policy, since the skills grade findings against it.

on:
  push:
    branches: [main]
    paths:
      - "aegis-vanguard/**"
      - "backend/app/services/agent/proof_policy.py"
      - "backend/app/services/agent/external_candidates.py"
  pull_request:
    paths:
      - "aegis-vanguard/**"
      - "backend/app/services/agent/proof_policy.py"
      - "backend/app/services/agent/external_candidates.py"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-vanguard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Check proof classes are in sync with Prowl
        run: python scripts/sync_vuln_classes.py --check
