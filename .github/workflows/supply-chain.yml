name: supply chain

on:
  push:
    branches: [main, 'claude/**', 'codex/**']
  pull_request: {}
  schedule:
    - cron: '17 6 * * 1'  # weekly: new advisories against unchanged pins
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pins:
    name: Pinned, verified build inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Images, actions, Go tools, downloads and git clones are pinned
        run: python3 scripts/supply_chain_check.py

  vulnerabilities:
    name: Known-vulnerable dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: false
      - name: Python (backend)
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit --progress-spinner off -r backend/requirements.txt
      - name: Node (frontend)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Go (aegis-oracle)
        working-directory: aegis-oracle
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
