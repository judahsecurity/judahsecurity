name: production deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy after validation
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    env:
      SECRET_KEY: deployment-ci-only-secret-with-at-least-32-characters
      PYTHONPATH: backend:harness:backend/packages/aegis_praetorium:backend/packages/asm_scanner_core
      AEGIS_EVIDENCE_DIR: /tmp/assessment-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-assessment-tests.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: aegis-oracle/go.mod
          cache-dependency-path: aegis-oracle/go.sum
      - run: python -m pip install -r backend/requirements-assessment-tests.txt
      - run: ruff check --select F821,F822,F823 backend/app/services/agent backend/app/services/interactsh_service.py backend/app/workers/interactsh_worker.py harness/local_harness
      - run: python -m pytest backend/tests harness/tests -o addopts= -q
      - run: go test ./...
        working-directory: aegis-oracle
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:config && npm run test:timeline
        working-directory: frontend
      - run: docker compose config --quiet

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Configure production SSH key
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$RUNNER_TEMP/ssh/production.pem"
          chmod 600 "$RUNNER_TEMP/ssh/production.pem"
      - name: Deploy validated revision
        env:
          DEPLOY_REF: ${{ inputs.ref }}
          DEPLOY_EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER || 'ubuntu' }}
          APP_DIR: ${{ vars.PRODUCTION_APP_DIR || '/opt/asm' }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
        run: scripts/push-to-ec2.sh "$PRODUCTION_HOST" "$RUNNER_TEMP/ssh/production.pem"
