# Keep pinned build inputs current through reviewed pull requests instead of
# floating tags. Download pins in backend/docker and aegis-vanguard/docker are
# not covered here; update them with scripts/pin_build_downloads.py.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}

  - package-ecosystem: docker
    directories: [/backend, /frontend, /aegis-oracle, /aegis-vanguard]
    schedule: {interval: weekly}
    groups:
      base-images: {patterns: ["*"]}

  - package-ecosystem: docker-compose
    directory: /
    schedule: {interval: weekly}

  - package-ecosystem: pip
    directories: [/backend, /aegis-vanguard, /aegis-claude-sdk]
    schedule: {interval: weekly}
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directories: [/frontend, /website]
    schedule: {interval: weekly}
    open-pull-requests-limit: 10

  - package-ecosystem: gomod
    directory: /aegis-oracle
    schedule: {interval: weekly}
