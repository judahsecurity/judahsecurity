services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: asm_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asm_password}
      POSTGRES_DB: ${POSTGRES_DB:-asm_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Note: DB init scripts are optional - remove if causing mount issues
      # - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asm_user} -d ${POSTGRES_DB:-asm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asm_network

  # Redis for caching and async tasks
  redis:
    image: redis:7-alpine
    container_name: asm_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asm_network

  # FastAPI Backend with ProjectDiscovery Tools
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asm_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-asm_user}:${POSTGRES_PASSWORD:-asm_password}@db:5432/${POSTGRES_DB:-asm_db}
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost","http://localhost:80","http://localhost:3000","http://localhost:8000","http://frontend:3000"]}
      - REDIS_URL=redis://redis:6379/0
      # AWS SQS Configuration (optional - for async scan job submission)
      - SQS_QUEUE_URL=${SQS_QUEUE_URL:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      # Common Crawl S3 Index (optional - for fast subdomain lookups)
      - CC_S3_BUCKET=${CC_S3_BUCKET:-}
      # SNI IP Ranges S3 Index (optional - for cloud asset discovery)
      - SNI_S3_BUCKET=${SNI_S3_BUCKET:-}
      # ProjectDiscovery Cloud API Key (optional - for Chaos subdomain dataset)
      - PDCP_API_KEY=${PDCP_API_KEY:-}
      # VulnCheck Exploit Intelligence token — powers the Vulnerability Intelligence feed
      # and Delphi VulnCheck KEV scoring floors.
      - VULNCHECK_API_TOKEN=${VULNCHECK_API_TOKEN:-}
      # NVD API key — raises rate limits for first-party CVE catalog enrichment.
      - NVD_API_KEY=${NVD_API_KEY:-}
      # Delphi extended KEV feeds (Shadowserver + KEVIntel via CIRCL). Default on.
      - DELPHI_EXTENDED_KEV_ENABLED=${DELPHI_EXTENDED_KEV_ENABLED:-true}
      - DELPHI_FIRE_CVE_PATH=${DELPHI_FIRE_CVE_PATH:-}
      # Neo4j Graph Database (optional - for asset relationship visualization)
      - NEO4J_URI=${NEO4J_URI:-}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-}
      # AI Agent Configuration (optional)
      - AI_PROVIDER=${AI_PROVIDER:-anthropic}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - KIMI_MODEL=${KIMI_MODEL:-kimi-k3}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      # Default points at the Compose `ollama` service (enable with profile `ollama`).
      # Host / Docker Desktop: http://host.docker.internal:11434/v1
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:14b}
      - OLLAMA_FALLBACK_ENABLED=${OLLAMA_FALLBACK_ENABLED:-true}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - AGENT_MAX_OUTPUT_TOKENS=${AGENT_MAX_OUTPUT_TOKENS:-4096}
      - AGENT_TOOL_OUTPUT_MAX_CHARS=${AGENT_TOOL_OUTPUT_MAX_CHARS:-20000}
      - AGENT_REQUEST_TIMEOUT_SECONDS=${AGENT_REQUEST_TIMEOUT_SECONDS:-660}
      - AGENT_REST_MAX_ITERATIONS=${AGENT_REST_MAX_ITERATIONS:-15}
      # Optional: redacted OTLP traces to a self-hosted Phoenix/Langfuse sidecar
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      # GitHub Secret Scanning (optional)
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # WPScan API token — required for --enumerate vp/vt (CVE mapping).
      # Without it, those enum modes abort. Free token: https://wpscan.com/register
      - WPSCAN_API_TOKEN=${WPSCAN_API_TOKEN:-}
      # Aegis Oracle service URL (internal docker network)
      - ORACLE_URL=${ORACLE_URL:-http://aegis-oracle:8742}
      - ORACLE_TIMEOUT=${ORACLE_TIMEOUT:-180}
      # Auth hardening: CAPTCHA (bot / brute-force protection on login + register)
      - CAPTCHA_ENABLED=${CAPTCHA_ENABLED:-false}
      - CAPTCHA_PROVIDER=${CAPTCHA_PROVIDER:-turnstile}
      - CAPTCHA_SITE_KEY=${CAPTCHA_SITE_KEY:-}
      - CAPTCHA_SECRET_KEY=${CAPTCHA_SECRET_KEY:-}
      # Auth hardening: rate limiting + public registration toggle
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_STORAGE_URI=${RATE_LIMIT_STORAGE_URI:-memory://}
      - RATE_LIMIT_LOGIN=${RATE_LIMIT_LOGIN:-5/minute}
      - RATE_LIMIT_REGISTER=${RATE_LIMIT_REGISTER:-5/hour}
      - RATE_LIMIT_REFRESH=${RATE_LIMIT_REFRESH:-20/minute}
      - ALLOW_PUBLIC_REGISTRATION=${ALLOW_PUBLIC_REGISTRATION:-false}
      # --- Authenticated crawl credentials (optional) ---
      # deep_crawl's self-service login can reference these as
      # {"login": {"username": "env:TARGET_USER", "password": "env:TARGET_PASS"}}
      # so secrets never appear inline in the agent's tool args / trace.
      # - TARGET_USER=${TARGET_USER:-}
      # - TARGET_PASS=${TARGET_PASS:-}
      # Directory for "secret:NAME" references (defaults to /run/secrets).
      # - SECRETS_DIR=/run/secrets
      # Dual Interceptor workers (Mac desktop + Ubuntu browser host)
      - INTERCEPTOR_WORKER_TOKEN=${INTERCEPTOR_WORKER_TOKEN:-}
      - INTERCEPTOR_WORKER_HEARTBEAT_TTL_SEC=${INTERCEPTOR_WORKER_HEARTBEAT_TTL_SEC:-90}
      - RECON_JOB_TIMEOUT_SEC=${RECON_JOB_TIMEOUT_SEC:-900}
      - INTERCEPTOR_PREFER_REMOTE_WORKERS=${INTERCEPTOR_PREFER_REMOTE_WORKERS:-true}
      - INTERCEPTOR_BIN=${INTERCEPTOR_BIN:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # For "secret:NAME" references, mount Docker/K8s secrets, e.g.:
    # secrets:
    #   - target_pass
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Note: Dev mount commented out to avoid read-only filesystem issues
      # - ./backend/app:/app/app:ro  # Mount app code for development
      - nuclei_templates:/home/appuser/.config/nuclei
      - scan_outputs:/app/outputs
      - screenshots_data:/app/data/screenshots
      - commoncrawl_data:/app/data/commoncrawl
      - sni_data:/app/data/sni-ip-ranges
      - panorama_data:/app/data/panorama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - asm_network
    cap_add:
      - NET_RAW
      - NET_ADMIN

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Leave empty when serving behind nginx (frontend uses window.location.origin
        # in browser; nginx proxies /api/ -> backend). Only set this if you bypass
        # nginx (e.g. http://YOUR_PUBLIC_IP:8000).
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    container_name: asm_frontend
    restart: unless-stopped
    expose:
      - "3000"
    # Direct port publish is OFF by default (nginx terminates 80/443).
    # If you want to bypass nginx, uncomment:
    # ports:
    #   - "${FRONTEND_PORT:-80}:3000"
    depends_on:
      - backend
    networks:
      - asm_network

  # nginx reverse proxy + TLS termination (Let's Encrypt)
  nginx:
    image: nginx:1.27-alpine
    container_name: asm_nginx
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - letsencrypt_certs:/etc/letsencrypt:ro
      - letsencrypt_www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - asm_network
    # The nginx entrypoint only auto-processes templates when CMD starts with
    # "nginx". Since we override CMD with /bin/sh for the reload loop, we do
    # the substitution manually with sed, then start nginx.
    # Reload every 6h so renewed Let's Encrypt certs are picked up automatically.
    command: >
      /bin/sh -c '
        sed "s|\$${DOMAIN}|$$DOMAIN|g" /etc/nginx/templates/app.conf.template > /etc/nginx/conf.d/app.conf &&
        rm -f /etc/nginx/conf.d/default.conf &&
        while :; do sleep 6h & wait $${!}; nginx -s reload; done &
        nginx -g "daemon off;"
      '

  # certbot - one-shot for issuance via scripts/init-letsencrypt.sh,
  # then runs in the background renewing every 12h. Nginx is reloaded
  # automatically via signal sharing through the shared network.
  certbot:
    image: certbot/certbot:latest
    container_name: asm_certbot
    restart: unless-stopped
    volumes:
      - letsencrypt_certs:/etc/letsencrypt
      - letsencrypt_www:/var/www/certbot
    depends_on:
      - nginx
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'

  # Scanner Worker for async scan tasks
  scanner:
    build:
      context: ./backend
      dockerfile: Dockerfile.scanner
    container_name: asm_scanner
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-asm_user}:${POSTGRES_PASSWORD:-asm_password}@db:5432/${POSTGRES_DB:-asm_db}
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - REDIS_URL=redis://redis:6379/0
      # AWS SQS Configuration (optional - falls back to database polling if not set)
      - SQS_QUEUE_URL=${SQS_QUEUE_URL:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      # ProjectDiscovery Cloud API Key (optional - for Chaos subdomain dataset)
      - PDCP_API_KEY=${PDCP_API_KEY:-}
      # Scanner performance tuning
      - MAX_CONCURRENT_SCANS=${MAX_CONCURRENT_SCANS:-5}
      - POLL_INTERVAL=${POLL_INTERVAL:-10}
      - PORT_SCAN_RATE=${PORT_SCAN_RATE:-2000}
      - NUCLEI_RATE_LIMIT=${NUCLEI_RATE_LIMIT:-300}
      # Keep Nuclei jobs bounded so they can't wedge the worker queue.
      # Runtime scales with host count: max(base, per_host * N), capped.
      # 75 hosts * 18s ≈ 22m — large enough to finish critical/high templates.
      - NUCLEI_MAX_RUNTIME_SECONDS=${NUCLEI_MAX_RUNTIME_SECONDS:-900}
      - NUCLEI_RUNTIME_SECONDS_PER_HOST=${NUCLEI_RUNTIME_SECONDS_PER_HOST:-18}
      - NUCLEI_MAX_RUNTIME_CAP_SECONDS=${NUCLEI_MAX_RUNTIME_CAP_SECONDS:-2700}
      - NUCLEI_MAX_TARGETS_PER_SCAN=${NUCLEI_MAX_TARGETS_PER_SCAN:-75}
      # Finding validation — native replay of the original detector / steps
      # on this scanner (no Docker). Override with docker|subprocess|auto if needed.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AEGIS_VALIDATOR_MODE=${AEGIS_VALIDATOR_MODE:-native}
      - AEGIS_VANGUARD_IMAGE=${AEGIS_VANGUARD_IMAGE:-aegis-vanguard:latest}
      - AEGIS_VANGUARD_PATH=${AEGIS_VANGUARD_PATH:-}
      - AEGIS_MODEL=${AEGIS_MODEL:-claude-sonnet-4-6}
      - AEGIS_VALIDATE_MAX_TURNS=${AEGIS_VALIDATE_MAX_TURNS:-20}
      - AEGIS_VALIDATE_TIMEOUT=${AEGIS_VALIDATE_TIMEOUT:-900}
      # --- Authenticated crawl credentials (optional) ---
      # Same as the backend: referenced by deep_crawl login as env:/secret: refs.
      # - TARGET_USER=${TARGET_USER:-}
      # - TARGET_PASS=${TARGET_PASS:-}
      # - SECRETS_DIR=/run/secrets
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      # Note: Dev mount commented out to avoid read-only filesystem issues
      # - ./backend/app:/app/app:ro
      - nuclei_templates:/home/appuser/.config/nuclei
      - scan_outputs:/app/outputs
      - screenshots_data:/app/data/screenshots
      # Host Docker daemon — required for AEGIS_VALIDATOR_MODE=docker
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - asm_network
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # Run scanner as root for masscan raw socket access
    user: "0:0"

  # Aegis Oracle — practical exploitability scoring engine
  # Reads ASM assets from Postgres, scores CVEs with OPES (0-10),
  # writes enriched findings back to the oracle schema.
  # Proxied through the backend at /api/v1/oracle/
  aegis-oracle:
    build:
      context: ./aegis-oracle
      dockerfile: Dockerfile
    container_name: asm_aegis_oracle
    restart: unless-stopped
    environment:
      - ORACLE_DB_DSN=postgresql://${POSTGRES_USER:-asm_user}:${POSTGRES_PASSWORD:-asm_password}@db:5432/${POSTGRES_DB:-asm_db}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # ProjectDiscovery Cloud Platform key — enables vulnx CVE enrichment
      # (higher rate limits; get free key at cloud.projectdiscovery.io)
      - PDCP_API_KEY=${PDCP_API_KEY:-}
      # VulnCheck Exploit Intelligence token — primary signal for KEV-class
      # exploitation evidence (confirmed exploited, weaponized, threat-actor
      # association). Without this, the X-component of OPES still works
      # but is missing VulnCheck's per-CVE actor/ransomware/botnet counts.
      - VULNCHECK_API_TOKEN=${VULNCHECK_API_TOKEN:-}
      # NVD API key — raises per-IP rate limit for the on-demand CVE ingest
      # fallback (used when vulnx doesn't yet have a brand-new CVE id).
      - NVD_API_KEY=${NVD_API_KEY:-}
    ports:
      - "${ORACLE_PORT:-8742}:8742"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8742/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - asm_network

  # Schedule Worker for recurring scans
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.scanner
    container_name: asm_scheduler
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-asm_user}:${POSTGRES_PASSWORD:-asm_password}@db:5432/${POSTGRES_DB:-asm_db}
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - REDIS_URL=redis://redis:6379/0
      - SCHEDULE_CHECK_INTERVAL=${SCHEDULE_CHECK_INTERVAL:-60}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.workers.schedule_worker"]
    volumes:
      - panorama_data:/app/data/panorama
    networks:
      - asm_network

  # Database Admin Interface (optional, for development)
  adminer:
    image: adminer:latest
    container_name: asm_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - db
    networks:
      - asm_network
    profiles:
      - dev

  # Neo4j Graph Database (for asset relationship modeling)
  neo4j:
    image: neo4j:5-community
    container_name: asm_neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - asm_network
    profiles:
      - graph

  # Local LLM fallback (Ollama). Enable with:
  #   COMPOSE_PROFILES=ollama in .env
  #   or: docker compose --profile ollama up -d
  # Needs ~12–16 GB RAM for qwen2.5:14b (use qwen2.5:7b on smaller instances).
  # Not published on a public interface — backend reaches it as http://ollama:11434/v1
  ollama:
    image: ollama/ollama:latest
    container_name: asm_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Localhost-only for admin/debug (pull status, tags). Do not open 11434 in SG.
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - asm_network
    profiles:
      - ollama

  # Optional Ubuntu Interceptor worker (host Chrome/Xvfb — not a full Interceptor image).
  # Preferred path is running the poller on the host; this service is a thin wrapper.
  # Enable: docker compose --profile interceptor up -d interceptor-worker
  # Requires: INTERCEPTOR_WORKER_TOKEN, host DISPLAY=:99, Chrome profile + extension loaded.
  # See docs/interceptor-workers.md
  interceptor-worker:
    image: python:3.11-slim
    container_name: asm_interceptor_worker
    restart: unless-stopped
    network_mode: host
    working_dir: /opt/asm/backend
    environment:
      - DISPLAY=${DISPLAY:-:99}
      - ASM_API_BASE=${ASM_API_BASE:-http://127.0.0.1:8000/api/v1}
      - INTERCEPTOR_WORKER_TOKEN=${INTERCEPTOR_WORKER_TOKEN:-}
      - INTERCEPTOR_BIN=${INTERCEPTOR_BIN:-interceptor}
      - PYTHONPATH=/opt/asm/backend
    volumes:
      - ./backend:/opt/asm/backend:ro
      - ${INTERCEPTOR_CHROME_PROFILE:-/var/lib/asm-interceptor/chrome-profile}:/chrome-profile
    command:
      - /bin/sh
      - -c
      - |
        pip install -q requests 2>/dev/null || true
        python -m app.services.interceptor_worker --kind ubuntu --worker-id ubuntu-compose-1
    profiles:
      - interceptor

  # One-shot model pull after Ollama is up (re-runs safely if model already present).
  ollama-init:
    image: ollama/ollama:latest
    container_name: asm_ollama_init
    depends_on:
      ollama:
        condition: service_started
    environment:
      - OLLAMA_HOST=ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:14b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Ollama at $$OLLAMA_HOST..."
        i=0
        while [ $$i -lt 60 ]; do
          if ollama list >/dev/null 2>&1; then
            break
          fi
          i=$$((i + 1))
          sleep 2
        done
        echo "Pulling model: $$OLLAMA_MODEL"
        ollama pull "$$OLLAMA_MODEL"
        echo "Ollama model ready."
        ollama list
    networks:
      - asm_network
    restart: "no"
    profiles:
      - ollama

  # Internal LLM trace UI (Phoenix). Not a customer feature.
  #   COMPOSE_PROFILES=observability
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:6006/v1/traces
  # Bound to loopback so pentest spans never hit a public interface.
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: asm_phoenix
    restart: unless-stopped
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - phoenix_data:/phoenix/data
    networks:
      - asm_network
    profiles:
      - observability

networks:
  asm_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nuclei_templates:
    driver: local
  scan_outputs:
    driver: local
  screenshots_data:
    driver: local
  commoncrawl_data:
    driver: local
  sni_data:
    driver: local
  panorama_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  letsencrypt_certs:
    driver: local
  letsencrypt_www:
    driver: local
  ollama_data:
    driver: local
  phoenix_data:
    driver: local
