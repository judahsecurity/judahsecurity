[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-runtime"
version = "0.1.0"
description = "Shared agent runtime contracts for Judah Security"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis_runtime*"]
