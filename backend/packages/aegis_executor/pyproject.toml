[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-executor"
version = "0.1.0"
description = "Hardened subprocess execution boundary for Judah Security"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis_executor*"]
